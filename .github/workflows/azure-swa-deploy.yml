name: Deploy to Azure Static Web Apps

# Production deploys on push to master; PRs to master get a SWA preview
# environment (built-in, same resource — no separate dev infra).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write   # lets the SWA action post the preview URL on the PR

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Videos are git-ignored, so site/public/videos/ is empty here.
      # The build emits R2 URLs (PUBLIC_VIDEO_CDN_BASE) and a tiny dist.
      - name: Install and build site
        working-directory: site
        env:
          PUBLIC_VIDEO_CDN_BASE: ${{ vars.PUBLIC_VIDEO_CDN_BASE }}
          PUBLIC_AUTH_ENABLED: ${{ vars.PUBLIC_AUTH_ENABLED }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site/dist   # pre-built output
          skip_app_build: true

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR preview environment
    steps:
      - name: Tear down preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
